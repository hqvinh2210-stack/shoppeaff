services:
  - type: web
    name: shoppeaff-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DOMAIN
        value: api.beehoantien.asia
      - key: CORS_ORIGINS
        value: https://www.beehoantien.asia,https://beehoantien.asia
      - key: DATABASE_URL
        fromDatabase:
          name: shoppeaff-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: shoppeaff-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: https://www.beehoantien.asia
      - key: AFFILIATE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_SECRET
        sync: false
      - key: ZALO_WEBHOOK_SECRET
        sync: false
      - key: ACCESSTRADE_API_TOKEN
        sync: false
      - key: ACCESSTRADE_CAMPAIGN_ID
        sync: false
      - key: AFFILIATE_API_KEY
        sync: false
      - key: AFFILIATE_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: redis
    name: shoppeaff-redis
    ipAllowList: []

databases:
  - name: shoppeaff-db
    databaseName: cashback
    user: cashback
